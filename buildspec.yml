version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.1
    commands:
      - echo Installing Composer...
      - curl -sS https://getcomposer.org/installer | php
      - php composer.phar install

  build:
    commands:
      - echo Build started...
      - cp .env.example .env
      - php artisan key:generate
      - php artisan config:clear
      - php artisan config:cache

artifacts:
  files:
    - '**/*'
